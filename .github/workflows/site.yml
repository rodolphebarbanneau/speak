name: Site

# speak.brbnn.com, from site/ (see site/README.md), on GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  # A published release changes the download links: the site is built again with it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Always main's site: a release's tag can be older than the latest change to the page.
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Reads the latest release into release.json. The token keeps it clear of the anonymous rate limit.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/tools/build.mjs

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm installs koffi's native package for this runner's chip only (Apple Silicon), and
      # the Intel build is packaged from the same folder: add the other chip's. Control mode
      # reaches macOS through koffi.
      - name: Add koffi for both Mac chips
        if: runner.os == 'macOS'
        run: |
          v=$(node -p "require('./node_modules/koffi/package.json').version")
          npm install --no-save --force "@koromix/koffi-darwin-x64@$v" "@koromix/koffi-darwin-arm64@$v"
          ls node_modules/@koromix

      - name: Typecheck
        run: npm run typecheck

      # whisper.cpp ships no macOS CLI builds: compile and bundle them (Metal).
      - name: Build whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-whisper.sh

      - name: Build
        run: npm run build

      # Signed once the repository has a system's secrets and variables (docs/signing.md), else
      # unsigned (macOS: ad hoc). The script gives each system only its own.
      - name: Package & publish (draft release)
        shell: bash
        run: bash scripts/package-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID certificate, then notarization by Apple ID or App Store Connect API key.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: Azure Artifact Signing, or a certificate file.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # The packages as people will get them: Electron's fuses, the signature when signed, and that
      # Speak starts with control mode's native parts working. The draft is already uploaded: if
      # this fails, don't publish it.
      - name: Check the packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/check-release.mjs; else node scripts/check-release.mjs; fi

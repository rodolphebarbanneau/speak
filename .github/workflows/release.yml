name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # whisper.cpp ships no macOS CLI builds: compile and bundle them (Metal).
      - name: Build whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-whisper.sh

      - name: Build
        run: npm run build

      - name: Package & publish (draft release)
        shell: bash
        # Secrets that aren't configured arrive as empty strings, and electron-builder reads an
        # empty CSC_LINK as a certificate path: unset them. Without a certificate, macOS builds
        # are signed ad-hoc: Apple Silicon Macs then open them after the "unidentified developer"
        # prompt, instead of reporting an unsigned app as damaged.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          args=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "${CSC_LINK:-}" ]; then args+=(-c.mac.identity=-); fi
          npx electron-builder --publish always "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing — set these secrets to sign/notarize:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
